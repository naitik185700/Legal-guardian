# Nginx Configuration for Guardian Legal Solutions
# Subdomain: legal.guardianfinancialexperts.com (or custom domain)

server {
    listen 80;
    server_name legal.guardianfinancialexperts.com kegal.guardianfinancialexperts.com legal.guardianfinancilaexpert.com kegal.guardianfinancilaexpert.com guardianlegalsolutions.com www.guardianlegalsolutions.com;

    # Client body limit for intake documents & enquiries
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static assets cache optimization
    location /_next/static {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}
